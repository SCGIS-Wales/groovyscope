# Default groovyscope configuration. Copy to .groovyscope.yaml in your workspace and override what you need.
# Every key can also be overridden with an environment variable: GROOVYSCOPE_<SECTION>__<KEY>, for example
# GROOVYSCOPE_DAEMON__HEAP=2g or GROOVYSCOPE_WORKSPACE__TRUST=true.
groovy:
  version: "6.0"          # Groovy language level the engine targets
  compat: ["5.1"]         # additional Groovy versions the code must stay compatible with
jdk:
  home: null              # explicit JDK home; null = discover (JAVA_HOME, /usr/libexec/java_home, PATH)
  minimum: 17             # Groovy 6 needs JDK 17+
  autoProvision: false    # true: download a checksum-verified JDK when none meets `minimum` (see `groovyscope jdk install`)
  vendor: "temurin"       # JDK autoProvision downloads: temurin (Eclipse Temurin) | corretto (Amazon Corretto)
workspace:
  sourceRoots: ["src/main/groovy", "src/test/groovy", "src/main/java", "src/test/java", "vars"]
  javaSources: true       # compile .java files under the roots too, so Groovy code resolves the project's Java classes
  classpath: []           # jars/dirs added to the analysis classpath; never inferred silently
  classpathFrom:
    gradleTask: null      # optional Gradle task that prints the classpath (Stage 1)
  exclude: ["**/build/**", "**/.gradle/**", "**/target/**", "**/node_modules/**"]
  trust: false            # only honoured after `groovyscope trust` (or GROOVYSCOPE_WORKSPACE__TRUST=true): allows
                          # global AST transforms from the workspace classpath, jdk.home and rule sets from this file
  maxFileBytes: 2000000   # source files larger than this are skipped (0 = no limit)
daemon:
  enabled: true           # Stage 2: warm JVM per workspace; until then the engine runs per session
  idleTimeoutMinutes: 60
  heap: "1g"
  cds: true               # Class Data Sharing archive for faster starts
lint:
  ruleset: null           # path to a CodeNarc ruleset; null = bundled defensive profile
  jenkinsRuleset: null    # path to a Jenkins pipeline ruleset; null = bundled profile
  failOnPriority: 2       # check exits non-zero on violations with this priority or higher
  publish: true           # push lint findings to the editor/agent as diagnostics
typecheck:
  nullChecker: "strict"   # off | lenient | strict (Groovy 6 NullChecker, on @CompileStatic/@TypeChecked code)
  sqlInjection: true      # Groovy 6 SqlInjectionChecker
  purity: false           # Groovy 6 PurityChecker and ModifiesChecker
  regex: true             # Groovy 6 RegexChecker (invalid regex literals)
  formatString: true      # Groovy 6 FormatStringChecker (String.format arguments)
  combiner: true          # Groovy 6 CombinerChecker (associative injectParallel combiners)
practices:
  enabled: true           # groovyscope's GS diagnostics (docs/practices.md); per-code overrides below
  severity: {}            # e.g. {GS002: info, RP030: off}; values: error | warning | info | off
profiles:
  paths: []              # runtime profile files or directories (YAML/JSON), see docs/profiles.md
  discover: true         # also load <root>/.groovyscope/profiles/ and ~/.groovyscope/profiles/
format:
  engine: "basic"         # basic (bundled: whitespace hygiene + safe CodeNarc-driven fixes) | greclipse (not bundled yet)
  indentSize: 4
  maxBlankLines: 1
  removeSemicolons: true
  properties: null        # Groovy Eclipse formatter properties (greclipse engine only)
output:
  maxResults: 50          # per response, with continuation tokens beyond that
  maxBytes: 16000         # hard cap on the JSON body returned to an agent
  maxMessageChars: 400    # finding messages longer than this are clipped in MCP answers (0 = never)
  structured: false       # MCP: also send results as structuredContent (doubles the payload; most clients read the text)
logging:
  level: "warning"        # debug | info | warning | error
  file: null              # null = stderr
