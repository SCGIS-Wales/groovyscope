# Builds and tests the engine against the latest stable CodeNarc release on Maven Central. The release used by
# every other build is pinned in engine/gradle/libs.versions.toml and bumped by Dependabot; this run tells, before
# that PR, whether the newer release still passes. A failure here is a heads-up, never a broken main.
name: CodeNarc canary

on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  canary:
    name: engine with the latest CodeNarc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build and test with the latest stable CodeNarc
        working-directory: engine
        run: |
          set -o pipefail
          ./gradlew build -PcodenarcResolve=true --console=plain 2>&1 | tee build.log
          pinned=$(sed -n 's/^codenarc *= *"\([^"]*\)".*/\1/p' gradle/libs.versions.toml)
          used=$(sed -n 's/^CodeNarc \([^:]*\):.*/\1/p' build.log | head -1)
          echo "pinned CodeNarc $pinned, canary used $used" >> "$GITHUB_STEP_SUMMARY"
          if [ "$used" != "$pinned" ]; then
            echo "::notice::CodeNarc $used passes the engine build; bump codenarc in libs.versions.toml (Dependabot proposes it)"
          fi
