name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # The engine integration tests fail instead of skipping when the JAR or the JDK is missing.
  GROOVYSCOPE_REQUIRE_ENGINE: "1"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test the engine
        working-directory: engine
        run: ./gradlew build --console=plain

      - name: Upload engine test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-test-reports-${{ matrix.os }}
          path: engine/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload the engine JAR for the other jobs
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-jar
          path: engine/build/libs/groovyscope-engine-*-all.jar
          if-no-files-found: error

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"

      - name: The lock file matches pyproject.toml
        working-directory: python
        run: uv lock --check

      - name: The repository's kiro/ and config/ match the package templates
        run: python3 scripts/sync_templates.py --check

      - name: Bundle the engine JAR into the package
        run: python3 scripts/bundle_jar.py

      - name: Sync Python dependencies
        working-directory: python
        run: uv sync --frozen

      - name: Lint (package, tests and scripts)
        working-directory: python
        run: |
          uv run ruff check . ../scripts
          uv run ruff format --check . ../scripts

      - name: Type check (package and scripts)
        working-directory: python
        run: |
          uv run mypy
          uv run mypy --strict ../scripts

      - name: Test (coverage gate 90%, includes the engine integration tests)
        working-directory: python
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Build wheel and sdist
        working-directory: python
        run: |
          uv build
          rm -f dist/.gitignore
          ls -la dist

      - name: Smoke test the wheel
        working-directory: python
        run: |
          uv tool install --from dist/*.whl groovyscope
          groovyscope version
          groovyscope doctor

  python-versions:
    name: python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Download the engine JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-jar
          path: engine/build/libs

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Bundle the engine JAR and sync Python dependencies
        run: |
          python3 scripts/bundle_jar.py
          cd python
          uv sync --frozen

      - name: Lint and type check
        working-directory: python
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Test (the engine integration tests included)
        working-directory: python
        run: uv run pytest -p no:cacheprovider

  # The engine targets Java 17 bytecode and the front end accepts JDK 17 and later: the integration tests run the
  # built JAR on the oldest supported JDK, the recommended one from two vendors and the newest LTS.
  engine-jdks:
    name: engine on ${{ matrix.distribution }} ${{ matrix.java }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distribution: temurin, java: "17" }
          - { distribution: temurin, java: "21" }
          - { distribution: corretto, java: "21" }
          - { distribution: temurin, java: "25" }
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }} (${{ matrix.distribution }})
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}

      - name: Download the engine JAR
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-jar
          path: engine/build/libs

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"

      - name: Bundle the engine JAR and sync Python dependencies
        run: |
          python3 scripts/bundle_jar.py
          cd python
          uv sync --frozen

      - name: Integration tests on this JDK
        working-directory: python
        run: uv run pytest -m integration -p no:cacheprovider
