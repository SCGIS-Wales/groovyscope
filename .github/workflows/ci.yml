name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test the engine
        working-directory: engine
        run: ./gradlew build --console=plain

      - name: Upload engine test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-test-reports-${{ matrix.os }}
          path: engine/build/reports/tests/
          if-no-files-found: ignore

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"

      - name: Bundle the engine JAR into the package
        run: python3 scripts/bundle_jar.py

      - name: Sync Python dependencies
        working-directory: python
        run: uv sync --frozen

      - name: Lint
        working-directory: python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        working-directory: python
        run: uv run mypy

      - name: Test (coverage gate 90%, includes the engine lifecycle integration test)
        working-directory: python
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Build wheel and sdist
        working-directory: python
        run: |
          uv build
          rm -f dist/.gitignore
          ls -la dist

      - name: Smoke test the wheel
        working-directory: python
        run: |
          uv tool install --from dist/*.whl groovyscope
          groovyscope version
          groovyscope doctor

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
            engine/build/libs/groovyscope-engine-*-all.jar
          if-no-files-found: error
