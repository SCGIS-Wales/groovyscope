name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and test the engine
        working-directory: engine
        run: ./gradlew build --console=plain

      - name: Upload engine test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-test-reports-${{ matrix.os }}
          path: engine/build/reports/tests/
          if-no-files-found: ignore

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"

      - name: Bundle the engine JAR into the package
        run: python3 scripts/bundle_jar.py

      - name: Sync Python dependencies
        working-directory: python
        run: uv sync --frozen

      - name: Lint
        working-directory: python
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        working-directory: python
        run: uv run mypy

      - name: Test (coverage gate 90%, includes the engine lifecycle integration test)
        working-directory: python
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Build wheel and sdist
        working-directory: python
        run: |
          uv build
          rm -f dist/.gitignore
          ls -la dist

      - name: Smoke test the wheel
        working-directory: python
        run: |
          uv tool install --from dist/*.whl groovyscope
          groovyscope version
          groovyscope doctor

  python-versions:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Sync Python dependencies
        working-directory: python
        run: uv sync --frozen

      - name: Lint and type check
        working-directory: python
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Test (the engine integration tests are skipped without the JAR; the build job runs them)
        working-directory: python
        run: uv run pytest -p no:cacheprovider

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
            engine/build/libs/groovyscope-engine-*-all.jar
          if-no-files-found: error
