# Dependency and workflow hygiene: the Gradle dependency graph is submitted from main (Dependabot alerts then cover
# the engine's Java dependencies too), a PR that adds a dependency with a known high or critical vulnerability
# fails, and the workflows themselves are audited by zizmor.
name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-dependencies:
    name: submit the Gradle dependency graph
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: engine

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The REST comparison GitHub's dependency-review action uses, read directly (no third-party action).
      - name: No added dependency with a known high or critical vulnerability
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changes=$(gh api "repos/$GH_REPO/dependency-graph/compare/$BASE...$HEAD")
          bad=$(jq -r '[.[] | select(.change_type == "added") | .name as $n | .version as $v
            | .vulnerabilities[]? | select(.severity == "high" or .severity == "critical")
            | "\($n) \($v): \(.advisory_ghsa_id) (\(.severity))"] | unique | .[]' <<<"$changes")
          if [ -n "$bad" ]; then
            echo "::error::this change adds dependencies with known vulnerabilities:"
            echo "$bad"
            exit 1
          fi
          echo "no added dependency has a known high or critical vulnerability"

  zizmor:
    name: audit the workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"

      - name: Run zizmor (pinned)
        run: |
          uvx --from 'zizmor==1.31.1' zizmor --format sarif .github/workflows > zizmor.sarif || true
          uvx --from 'zizmor==1.31.1' zizmor --min-severity medium .github/workflows

      - name: Upload the findings to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: zizmor.sarif
          category: zizmor
