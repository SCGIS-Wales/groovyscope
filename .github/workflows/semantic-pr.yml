name: Semantic PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            deps
            revert
          requireScope: false
          # Lowercase subjects, except Dependabot's fixed "Bump x from a to b".
          subjectPattern: ^(?:(?![A-Z])|Bump ).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
