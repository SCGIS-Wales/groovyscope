# Publish workflow. Its file name, `workflow.yml`, is what the PyPI trusted publisher for
# SCGIS-Wales/groovyscope is registered against; do not rename it without updating PyPI.
name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: build artefacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ inputs.tag }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build the engine and its SBOM
        working-directory: engine
        run: |
          ./gradlew build --console=plain
          ./gradlew cyclonedxBom --no-configuration-cache --console=plain

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"

      - name: Bundle the engine JAR and build the wheel and sdist
        run: |
          python3 scripts/bundle_jar.py
          cd python
          uv sync --frozen --no-dev
          uv build
          rm -f dist/.gitignore

      - name: Python SBOM
        working-directory: python
        run: uvx --from cyclonedx-bom cyclonedx-py environment .venv --of JSON -o dist/groovyscope-python-sbom.cdx.json

      - name: Collect release assets and checksums
        run: |
          mkdir -p release
          cp python/dist/*.whl python/dist/*.tar.gz release/
          cp engine/build/libs/groovyscope-engine-*-all.jar release/
          cp engine/build/reports/cyclonedx/bom.json release/groovyscope-engine-sbom.cdx.json
          cp python/dist/groovyscope-python-sbom.cdx.json release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  attest:
    name: attest provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-assets
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.jar

  pypi:
    name: publish to PyPI (trusted publishing)
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/groovyscope/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true

  release-assets:
    name: attach assets to the GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-assets
          path: release

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.tag }}" release/* --clobber

  # Opens a pull request on SCGIS-Wales/homebrew-tap with the formula for this release. GITHUB_TOKEN cannot
  # write to another repository, so the job needs HOMEBREW_TAP_TOKEN (a fine-grained PAT with contents and
  # pull-requests write on the tap). Without it the job explains what to add and succeeds.
  homebrew:
    name: update the Homebrew tap
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: SCGIS-Wales/homebrew-tap
    steps:
      - name: Check out ${{ inputs.tag }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Explain the missing token
        if: env.TAP_TOKEN == ''
        run: |
          echo "::notice title=Homebrew tap not updated::Add the HOMEBREW_TAP_TOKEN secret (fine-grained PAT, contents + pull requests write on ${TAP_REPO}) to open tap PRs automatically; or run scripts/homebrew_formula.py by hand."

      - name: Render the formula once PyPI serves the release
        if: env.TAP_TOKEN != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/formula"
          python3 scripts/homebrew_formula.py --version "${TAG#v}" --wait 900 --output "${RUNNER_TEMP}/formula/groovyscope.rb"

      - name: Open a pull request on the tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "${RUNNER_TEMP}/tap"
          cd "${RUNNER_TEMP}/tap"
          mkdir -p Formula
          cp "${RUNNER_TEMP}/formula/groovyscope.rb" Formula/groovyscope.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "groovyscope-${version}"
          git add Formula/groovyscope.rb
          git commit -m "groovyscope ${version}"
          git push --force origin "groovyscope-${version}"
          gh pr create --repo "${TAP_REPO}" --head "groovyscope-${version}" --title "groovyscope ${version}" \
            --body "Formula for https://github.com/SCGIS-Wales/groovyscope/releases/tag/${TAG} (sdist from PyPI, bundled engine JAR, openjdk@21)." \
            || echo "::notice::a pull request for groovyscope-${version} already exists"
