# Publish workflow. Its file name, `workflow.yml`, is what the PyPI trusted publisher for
# SCGIS-Wales/groovyscope is registered against; do not rename it without updating PyPI.
name: Publish

# Only dispatched (by release-please.yml or by hand): never called as a reusable workflow, because PyPI checks that
# the signing certificate names this file.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

# One publish per tag at a time; a second dispatch of the same tag waits instead of racing the first.
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Publishes only what CI has passed: the tag must be a release tag, name the version every build file declares,
  # and its commit must have green checks (they may still be running right after the release PR merged).
  verify:
    name: verify the tag and its checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out ${{ inputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is a release tag naming the declared version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a release tag (vX.Y.Z)"; exit 1; }
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "::error::no tag $TAG"; exit 1; }
          version="${TAG#v}"
          python_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml | head -1)
          engine_version=$(sed -n 's/^version=\(.*\)$/\1/p' engine/gradle.properties | head -1)
          for declared in "$python_version" "$engine_version"; do
            [ "$declared" = "$version" ] || { echo "::error::$TAG does not match the declared version $declared"; exit 1; }
          done

      - name: The tagged commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          required=("build (ubuntu-latest)" "build (macos-latest)" "python 3.13" "python 3.14" "python 3.15"
            "analyze (python)" "analyze (java-kotlin)")
          for attempt in $(seq 1 90); do
            runs=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | {name, status, conclusion}]')
            pending=0
            for name in "${required[@]}"; do
              state=$(jq -r --arg n "$name" '[.[] | select(.name == $n)] | sort_by(.status != "completed") | .[0] // {} |
                "\(.status // "missing") \(.conclusion // "")"' <<<"$runs")
              case "$state" in
                "completed success") ;;
                completed*) echo "::error::check '$name' on $sha: $state"; exit 1 ;;
                *) pending=1 ;;
              esac
            done
            [ "$pending" = 0 ] && { echo "every required check passed on $sha"; exit 0; }
            sleep 30
          done
          echo "::error::the required checks on $sha did not finish within 45 minutes"
          exit 1

  build:
    name: build artefacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out ${{ inputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build the engine and its SBOM
        working-directory: engine
        run: |
          ./gradlew build --console=plain
          ./gradlew cyclonedxBom --no-configuration-cache --console=plain

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"

      - name: Bundle the engine JAR and install the runtime dependencies
        run: |
          python3 scripts/bundle_jar.py
          cd python
          uv sync --frozen --no-dev

      # Before the build, and into its own folder, so the SBOM tool never sees the files that are attested and
      # published. The tool is pinned.
      - name: Python SBOM
        working-directory: python
        run: |
          mkdir -p ../sbom
          uvx --from 'cyclonedx-bom==7.5.0' cyclonedx-py environment .venv --of JSON -o ../sbom/groovyscope-python-sbom.cdx.json

      - name: Build the wheel and sdist
        working-directory: python
        run: |
          uv build
          rm -f dist/.gitignore

      - name: Collect release assets and checksums
        run: |
          mkdir -p release
          cp python/dist/*.whl python/dist/*.tar.gz release/
          cp engine/build/libs/groovyscope-engine-*-all.jar release/
          cp engine/build/reports/cyclonedx/bom.json release/groovyscope-engine-sbom.cdx.json
          cp sbom/groovyscope-python-sbom.cdx.json release/
          # The runtime dependencies with every hash, for installs that verify them (the Homebrew formula).
          (cd python && uv export --frozen --no-dev --no-emit-project --format requirements-txt) \
            > release/groovyscope-requirements.txt
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  attest:
    name: attest provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.jar
            release/SHA256SUMS.txt
            release/*.cdx.json
            release/groovyscope-requirements.txt

  pypi:
    name: publish to PyPI (trusted publishing)
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/groovyscope/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true

  # After PyPI, so a release page never offers files PyPI refused; without --clobber an asset already attached (a
  # second run of the same tag) is never replaced.
  release-assets:
    name: attach assets to the GitHub Release
    needs: [build, attest, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      # --clobber: a re-run after a partial upload (a transient GitHub error) replaces what the first try left,
      # from the same build, instead of failing on the asset that is already there.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload --clobber "$TAG" release/*
