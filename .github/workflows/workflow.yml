# Publish workflow. Its file name, `workflow.yml`, is what the PyPI trusted publisher for
# SCGIS-Wales/groovyscope is registered against; do not rename it without updating PyPI.
name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: build artefacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ inputs.tag }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true

      - name: Build the engine and its SBOM
        working-directory: engine
        run: |
          ./gradlew build --console=plain
          ./gradlew cyclonedxBom --no-configuration-cache --console=plain

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
          python-version: "3.12"

      - name: Bundle the engine JAR and build the wheel and sdist
        run: |
          python3 scripts/bundle_jar.py
          cd python
          uv sync --locked --no-dev
          uv build
          rm -f dist/.gitignore

      - name: Python SBOM
        working-directory: python
        run: uvx --from cyclonedx-bom cyclonedx-py environment .venv --of JSON -o dist/groovyscope-python-sbom.cdx.json

      - name: Collect release assets and checksums
        run: |
          mkdir -p release
          cp python/dist/*.whl python/dist/*.tar.gz release/
          cp engine/build/libs/groovyscope-engine-*-all.jar release/
          cp engine/build/reports/bom.json release/groovyscope-engine-sbom.cdx.json
          cp python/dist/groovyscope-python-sbom.cdx.json release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Upload Python distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error

      - name: Upload release assets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

  attest:
    name: attest provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-assets
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.jar

  pypi:
    name: publish to PyPI (trusted publishing)
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/groovyscope/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true

  release-assets:
    name: attach assets to the GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-assets
          path: release

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.tag }}" release/* --clobber
