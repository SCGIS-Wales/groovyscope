name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release PR or tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With RELEASE_PLEASE_TOKEN (a fine-grained token of a maintainer: contents and pull requests, write, this
      # repository only) the release PR is opened as that person: its CI runs without the manual approval that
      # bot-opened PRs need, and its merge is a user push, which starts this workflow again to cut the tag.
      # Without the secret the workflow falls back to GITHUB_TOKEN and the old manual steps apply.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR is marked to merge itself once its checks pass. Only GitHub's own auto-merge is requested,
      # never a merge: `gh pr merge --auto` merges at once when nothing is required yet (no checks reported, no
      # branch protection), which released 0.16.1 and 0.17.0 without CI. The mutation below fails instead when
      # "Allow auto-merge" is off or the PR has no pending requirement, and the PR then waits for a person or the
      # session that drives the release. Without RELEASE_PLEASE_TOKEN nothing is requested: a merge by the
      # built-in token would not start the tagging run.
      - name: Mark the release PR to merge itself when its checks pass
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RELEASE_PLEASE_TOKEN is not set; merge the release PR once its checks are green"
            exit 0
          fi
          for number in $(printf '%s' "$PRS" | jq -r '.[].number'); do
            node=$(gh pr view "$number" --json id --jq .id) || continue
            gh api graphql -f query='mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId }
            }' -f id="$node" \
              || echo "::notice::auto-merge was not enabled for the release PR; merge it once its checks are green"
          done

  # Releases created with GITHUB_TOKEN do not fire `release: published` in other workflows, and
  # calling workflow.yml as a reusable workflow makes the Sigstore certificate name this file as the
  # build config, which PyPI's trusted publisher (registered for workflow.yml) rejects. workflow_dispatch
  # is one of the two events GITHUB_TOKEN may trigger, so the publish is dispatched as its own run.
  publish:
    name: dispatch publish ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch workflow.yml at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run workflow.yml --ref "$TAG" -f tag="$TAG"
