version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "gradle"
    directory: "/engine"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
