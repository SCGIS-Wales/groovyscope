version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "gradle"
    directory: "/engine"
    schedule:
      interval: "weekly"
    ignore:
      # Xtext 2.41 and later are compiled for Java 21; the engine supports Java 17 (checkJava17Bytecode).
      - dependency-name: "org.eclipse.xtext:org.eclipse.xtext.xbase.lib"
        versions: [">= 2.41.0"]
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
