<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="groovyscope architecture: Kiro CLI talks to the groovyscope Python front end, which talks to one warm JVM engine per workspace, which reads your code; diagnostics, impact, graphs and merge request comments come back.">
