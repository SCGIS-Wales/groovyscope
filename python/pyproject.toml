[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "groovyscope"
version = "0.27.0"
description = "Groovy 5/6 code intelligence for AI coding agents: LSP and MCP front ends over one JVM engine"
readme = "README.md"
# The wheel bundles the engine JAR: its libraries' licences are listed in THIRD-PARTY-NOTICES.md.
license = "Apache-2.0 AND EPL-2.0 AND EPL-1.0 AND BSD-3-Clause AND BSD-2-Clause AND MIT"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "SCGIS-Wales" }]
keywords = ["groovy", "lsp", "mcp", "kiro", "code-intelligence", "codenarc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Java",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.2,<9",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.23,<5",
  "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/SCGIS-Wales/groovyscope"
Documentation = "https://github.com/SCGIS-Wales/groovyscope/tree/main/docs"
Changelog = "https://github.com/SCGIS-Wales/groovyscope/blob/main/CHANGELOG.md"
Issues = "https://github.com/SCGIS-Wales/groovyscope/issues"

[project.scripts]
groovyscope = "groovyscope.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "hypothesis>=6.140,<7",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.14,<1",
  "mypy>=1.19,<3",
  "types-PyYAML>=6.0.12",
  "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/groovyscope"]
artifacts = ["src/groovyscope/_jar/*.jar", "src/groovyscope/_jar/_manifest.json"]

[tool.hatch.build.targets.sdist]
include = [
  "src/groovyscope",
  "tests",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]
artifacts = ["src/groovyscope/_jar/*.jar", "src/groovyscope/_jar/_manifest.json"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "PL", "RUF", "ANN", "T20", "S",
]
ignore = [
  "PLR0913",  # click commands legitimately take several parameters
  "T201",     # the CLI prints by design
  "S603",     # subprocess calls are deliberate (java); arguments are never shell-interpolated
  "S607",     # `java` is resolved from JAVA_HOME or PATH on purpose
  "ANN401",   # JSON-shaped values are legitimately Any
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "ARG001"]
# MCP tool functions take the session context (root, engine call, caps) as leading positional parameters that
# functools.partial binds once per session; the client sees only the rest.
"src/groovyscope/mcp_server.py" = ["PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["groovyscope"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "strict"
markers = [
  "integration: boots the real engine JAR (skipped unless it is available)",
]

[tool.coverage.run]
source = ["groovyscope"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
]
